{% extends "base.html" %}

{% block title %}Nuovo Articolo Wiki{% endblock %}

{% block content %}

<div class="card mb-4">

    <div class="card-body">

        <h2 class="fw-bold mb-0">
            📚 Scrivi Articolo Tecnico Wiki
        </h2>

    </div>

</div>

<div class="card shadow-sm border-0">

    <div class="card-body p-4">

        <form method="post" action="/admin/wiki/new">

            <div class="mb-3">

                <label class="form-label fw-bold">Titolo Articolo</label>

                <input type="text"
                       name="title"
                       id="wiki-title"
                       class="form-control text-dark fw-bold"
                       placeholder="es. Tangzhong (Roux)"
                       required>

            </div>

            <div class="row g-3">

                <div class="col-md-6 mb-3">

                    <label class="form-label fw-bold">Slug URL (Automatico)</label>

                    <input type="text"
                           name="slug"
                           id="wiki-slug"
                           class="form-control text-muted"
                           placeholder="es. tangzhong-roux"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label fw-bold">Categoria</label>

                    <select name="category" class="form-select fw-bold">
                        <option value="Tecniche" selected>Tecniche d'impasto</option>
                        <option value="Lieviti">Lievitazione e Fermentazione</option>
                        <option value="Ingredienti">Analisi Ingredienti</option>
                        <option value="Generale">Generale</option>
                    </select>

                </div>

            </div>

            <div class="mb-4">

                <label class="form-label fw-bold">Contenuto Scientifico / Guida</label>

                <textarea name="content"
                          class="form-control text-dark"
                          rows="12"
                          placeholder="Inserisci la spiegazione chimica o tecnica approfondita..."
                          required></textarea>

            </div>

            <div class="d-flex justify-content-between">

                <a href="/admin/wiki" class="btn btn-outline-secondary px-4 py-2">
                    Annulla
                </a>

                <button type="submit" class="btn btn-primary px-5 fw-bold shadow-sm">
                    ✍ Publica nella Wiki
                </button>

            </div>

        </form>

    </div>

</div>

<script>
document.getElementById('wiki-title').addEventListener('input', function() {
    const slug = this.value.toLowerCase()
        .replace(/[^a-z0-9\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
    document.getElementById('wiki-slug').value = slug;
});
</script>

{% endblock %}
